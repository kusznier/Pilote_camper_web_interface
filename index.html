.solar-micro{display:flex;justify-content:space-between;gap:5px;color:#9ab5c6;font-size:11px;padding:2px 1px}
.solar-micro b{color:#e1eff8}
.status-tile.on .glyph{filter:drop-shadow(0 0 6px #36f9c0)}
.status-tile.off .glyph{color:#8194a3}
.control-tile .glyph{width:54px;height:54px;color:#8797a5;opacity:.7}
.control-tile:not(.on){border-color:#3e586c;background:linear-gradient(155deg,#172b39,#0c1c29)}
.control-tile:not(.on) strong{color:#9bb0bf}
.control-tile:not(.on) .state-word{color:#8197a6}
.control-tile.on{box-shadow:inset 0 0 0 1px #25edce4c,0 0 20px #0acaaa40}
.control-tile.on .glyph{color:#71ffee;opacity:1;filter:drop-shadow(0 0 13px #31d9c4)}
.control-tile.on.type-light{border-color:#ffc969;background:linear-gradient(155deg,#52452d,#242b33);box-shadow:inset 0 0 0 1px #ffd07357,0 0 22px #ffa64642}
.control-tile.on.type-light .glyph{color:#ffe08d;filter:drop-shadow(0 0 12px #ffd177)}
.control-tile.on.type-pump .glyph{color:#56d7fb;filter:drop-shadow(0 0 12px #43d0ff)}
.control-tile.on.type-plug{border-color:#c5a5f1;background:linear-gradient(155deg,#39314a,#14232c);box-shadow:inset 0 0 0 1px #b990f255,0 0 22px #a078e540}
.control-tile.on.type-plug .glyph{color:#cfb2ff;filter:drop-shadow(0 0 12px #b18bff)}
@media(max-width:650px){.utility-card{width:100%;min-width:0;margin-top:8px;padding:9px 12px}.utility-box{height:69px}.battery-soc-track{height:8px}.battery-hint{font-size:10px}}
@media(min-width:651px) and (max-height:650px){.data-row{min-height:138px}.utility-box{height:62px}.utility-card{padding:8px 10px}.solar-micro{font-size:10px}.battery-soc-label{margin:4px 0 2px}.battery-soc-track{height:8px}}
/* V3: arming, command acknowledgements and pending states. */
.control-arm{margin:0 0 12px;padding:12px 15px;display:-webkit-flex;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #446273;border-radius:14px;background:#132b39;color:#c7d9e3}
.control-arm.enabled{background:#123d3b;border-color:#27d5b7}
.control-arm strong{display:block;font-size:15px;color:#e6f3f9}
.control-arm p{margin:4px 0 0;font-size:12px;line-height:1.35;color:#9bb6c5}
.control-arm button{flex-shrink:0;padding:11px 14px;min-height:48px;border:1px solid #48ceb6;border-radius:10px;background:#105a53;color:#e2fff7;font-weight:bold;font-size:14px}
.control-arm.enabled button{background:#492d36;border-color:#bd7b81;color:#ffe6e6}
.control-tile.pending{border-color:#f7ca70;box-shadow:inset 0 0 0 1px #f7ca7044;opacity:.85}
.control-tile.pending .state-word{color:#f7cf79}
.control-tile:disabled{cursor:default}
.control-tile:not(.on):not(.pending) .glyph{filter:none}
@media(max-width:650px){.control-arm{padding:10px 11px}.control-arm strong{font-size:13px}.control-arm p{font-size:11px}.control-arm button{font-size:12px;padding:8px}}
</style>

  function screenIntro(title,desc,locked,badge) {
    return '<div class="screen-header"><div><h1>'+title+'</h1><p>'+desc+'</p></div><span class="readonly-label">'+h(badge || (locked?'READ ONLY':'DEMO'))+'</span></div>';
  }
  var CONTROL_NAMES={Eclairage:'Lights',PompeAEau:'Water pump',Auxiliaire:'AUX'};
  function isControlReady(key) {
    var item=state.data.dc[key];
    return !!(state.mode==='live' && state.connection==='online' && state.socket &&
      state.socket.readyState===1 && item && item.is_alived===true &&
      (item.dc_state==='ON' || item.dc_state==='OFF') &&
      item.dc_enabled!==false && !state.pendingDc[key]);
  }
  function controlTile(name,key,kind) {
    var value=dcState(key), active=value==='ON';
    var unknown=value!=='ON' && value!=='OFF';
    var pending=state.pendingDc[key];
    var enabled=state.mode==='demo' || (state.controlArmed && isControlReady(key));
    var label=pending?'Waiting for confirmation':unknown?'No data':active?'On':'Off';
    return '<button type="button" class="control-tile type-'+kind+(active?' on':'')+(pending?' pending':'')+'" '+
      'data-action="toggle-control" data-key="'+key+'"'+(enabled?'':' disabled')+
      ' aria-label="'+h(name)+' - '+h(label)+'">'+icon(kind)+'<strong>'+h(name)+'</strong><span class="state-word">'+
      h(label)+'</span></button>';
  }
  function renderControls() {
    var demo=state.mode==='demo', live=state.mode==='live';
    var desc='Lights, pump and AUX — states confirmed by Scheiber';
    var badge=demo?'DEMO':state.controlArmed?'CONTROLS ACTIVE':'READ ONLY';
    var arm='';
    if(live){
      arm='<div class="control-arm'+(state.controlArmed?' enabled':'')+'"><div><strong>'+
        (state.controlArmed?'Controls unlocked':'Controls locked')+'</strong><p>'+
        (state.controlArmed?'Commands are sent only on tap. Locking the controls does not change device states.':
        'Unlock manually. The button changes color only after the controller confirms the new state.')+
        '</p></div><button type="button" data-action="arm-controls"'+
        (state.connection==='online'?'':' disabled')+'>'+
        (state.controlArmed?'Lock':'Unlock')+'</button></div>';
    }
    return screenIntro('Device controls',desc,!demo,badge)+arm+
      '<div class="control-grid">'+controlTile('Lights','Eclairage','light')+
      controlTile('Water pump','PompeAEau','pump')+controlTile('AUX','Auxiliaire','plug')+'</div>'+
      '<div class="card master-card"><div class="master-title"><strong>Master switch - turn off devices</strong>'+icon('power')+'</div>'+
      '<div id="master-slider" class="master-slider'+(demo?'':' disabled')+'" aria-label="Slide to turn off devices">'+
      '<div id="slide-knob" class="slide-knob">'+icon('arrows')+'</div><span class="slide-track-label">'+
      (demo?'Slide to turn off':'Disabled in live mode')+'</span></div>'+
      '<p class="under-master">'+(demo?'Master OFF is simulated; no physical commands are sent.':
      'Master OFF is disabled until the OEM general_off_command mapping is verified.')+'</p></div>'+
      '<div class="notice info">'+(demo?'Demo mode does not alter real device states.':
      'Live mode: individual Dc ON/OFF commands. No automatic retries. Truma controls remain disabled.')+'</div>';
  }
  function renderTruma() {
    var demo=state.mode==='demo', d=activeData(), t=d.heating;
    var installed=t&&t.heater_type&&t.heater_type!=='NONE';
    var active=demo&&installed, temp=t?prop(t,'heater_set_point'):null;
    var label=state.mode==='live'&&!installed?'Truma: no active controller reported (heater_type: NONE)':'Space heating and hot water';
    function modeItem(id,name,kind) { return '<button type="button" class="heat-mode'+(state.trumaTab===id?' active':'')+'" data-action="truma-tab" data-value="'+id+'">'+icon(kind)+name+'</button>'; }
    var content='';
    if(state.trumaTab==='room') {
      content='<div class="truma-columns"><div class="card"><h2>Target temperature</h2><div class="setpoint"><button class="stepper" data-action="setpoint-minus"'+(active?'':' disabled')+'>−</button><span class="big-number">'+(hasValue(temp)?fmt(temp,1)+' °C':'--')+'</span><button class="stepper" data-action="setpoint-plus"'+(active?'':' disabled')+'>+</button></div><p class="line-quiet">Inside: '+formatTemp(t?prop(t,'heater_current_temperature'):null)+'</p></div><div class="card"><h2>Heating mode</h2><div class="truma-choices">'+
        choice('Gas','gas',t&&t.heater_gaz_mode,active)+choice('230 V / 900 W','900',t&&t.heater_electric_power===900,active)+choice('230 V / 1800 W','1800',t&&t.heater_electric_power===1800,active)+choice('Auto','auto',false,active)+'</div></div></div>';
    } else if (state.trumaTab==='water') {
      content='<div class="card panel-section"><h2>Hot water</h2><p class="line-quiet">Water heating is separate from space heating. Available functions depend on the Truma controller.</p><div class="truma-choices">'+choice('Off','water-off',t&&t.heater_hot_water_boost===0,active)+choice('Normal','water-normal',t&&t.heater_hot_water_boost===1,active)+choice('Boost','water-boost',t&&t.heater_hot_water_boost===2,active)+'</div></div>';
    } else {
      content='<div class="card panel-section"><h2>Ventilation</h2><p class="line-quiet">Fan speed display and planned selection. Available modes require validation with the Truma controller.</p><div class="truma-choices">'+choice('ECO','fan-eco',t&&t.heater_fan_speed==='ECO',active)+choice('Normal','fan-normal',t&&t.heater_fan_speed==='NORMAL',active)+choice('Boost','fan-boost',t&&t.heater_fan_speed==='BOOST',active)+'</div></div>';
    }
    return screenIntro('Truma',label,!demo)+
      '<div class="truma-top">'+modeItem('room','Room','truma')+modeItem('water','Hot water','water')+modeItem('fan','Ventilation','fan')+'</div>'+content+
      '<div class="notice">'+(state.mode==='live'&&!installed?'Scheiber reports no active Truma controller. The menu remains visible, but physical controls are disabled.':'The Truma menu is a conceptual representation. In demo mode all selections are simulated locally.')+'</div>';
  }
  function choice(label,value,selected,enabled) {
    return '<button type="button" class="choice'+(selected?' on':'')+'" data-action="truma-choice" data-value="'+value+'"'+(enabled?'':' disabled')+'>'+label+'</button>';
  }
  function detail(label,value,kind,note) {
    return '<div class="card"><div class="heading-row">'+icon(kind)+'<strong>'+label+'</strong></div><span class="kicker">'+(note||'')+'</span><div class="big-number">'+value+'</div></div>';
  }
  function showBoolean(name) {
    var v=getInformation(name); return hasValue(v)?(Number(v)?'YES':'NO'):'--';
  }
  function renderEnergy() {
    var d=activeData(), b=d.battery, voltage=prop(b,'battery_voltage_level'), current=prop(b,'battery_current');
    return screenIntro('Energy','Bank 12 V / 400 Ah · IBS diagnostic readings',state.mode==='live')+
      '<div class="detail-grid">'+detail('Voltage',hasValue(voltage)?fmt(voltage,2)+' V':'--','battery','Scheiber reading')+
      detail('IBS current',hasValue(current)?fmt(current,2)+' A':'--','energy','May not include both batteries')+
      detail('Solar',hasValue(getInformation('SolarCurrent'))?fmt(getInformation('SolarCurrent'),1)+' A':'--','sun','Scheiber sensor')+
      detail('IBS temperature',formatTemp(prop(b,'battery_temperature')),'therm','Battery equipped with IBS')+'</div>'+
      '<div class="detail-grid" style="margin-top:12px">'+detail('IBS SOC',hasValue(prop(b,'battery_state_of_charge'))?fmt(prop(b,'battery_state_of_charge'),0)+'%':'--','alert','UNRELIABLE for the full 400 Ah bank')+
      detail('230 V shore power',showBoolean('Presence_230V'),'plug','No data does not mean OFF')+
      detail('Engine running',showBoolean('D_PLUS'),'power','D_PLUS signal')+'</div>'+
      '<div class="notice">This example setup uses two parallel 200 Ah batteries, but the IBS measures only one. The indicated SOC must not be treated as an accurate SOC of the entire bank. No EMB settings are modified.</div>';
  }
  function waterDetail(name, obj, typ) {
    var level=obj?percent(obj.tank_level):null;
    var alarm=activeData().alarm[typ], alarmText=alarm?(alarm.alarm_state==='SET'?'ACTIVE':alarm.alarm_state):'--';
    return '<div class="card panel-section"><div class="heading-row blue">'+icon('water')+'<h2>'+name+'</h2></div><div class="big-number" style="margin:16px 0">'+(level===null?'--':fmt(level,0)+'%')+'</div><div class="progress-track" style="height:24px"><div class="progress-fill" style="width:'+(level===null?0:level)+'%"></div></div><p class="line-quiet">Capacity: '+(obj&&hasValue(obj.tank_capacity)?fmt(obj.tank_capacity,0)+' l':'--')+' · Alarm: '+alarmText+'</p></div>';
  }
  function renderWater() {
    var d=activeData();
    return screenIntro('Tanks','Levels reported by Scheiber sensors',state.mode==='live')+
      '<div class="truma-columns">'+waterDetail('Fresh water',d.tanks.EP_1,'a_EP_1')+waterDetail('Grey water',d.tanks.EU_1,'a_EU_1')+'</div><div class="notice info">EP_1 and EU_1 tanks were detected. Levels are read from sensors; tank calibration is not modified.</div>';
  }
  function connectionUrl() {
    if(state.connectionMode==='local') return 'ws://127.0.0.1:9474/';
    if(state.connectionMode==='network') return 'ws://'+state.networkHost+':9474/';
    return state.customUrl;
  }
  function radioConn(mode,label) {
    return '<button class="radio-button'+(state.connectionMode===mode?' selected':'')+'" data-action="conn-mode" data-value="'+mode+'">'+label+'</button>';
  }
  function renderSettings() {
    return '<div class="screen-header"><div><h1>Settings</h1><p>Connection settings, display mode, and dimming</p></div></div>'+
      '<div class="settings-grid"><div class="card"><h2>Scheiber connection</h2><div class="radio-row">'+radioConn('local','Local tablet')+radioConn('network','Camper Wi-Fi')+radioConn('custom','Custom URL')+'</div>'+
      (state.connectionMode==='network'?'<div class="field"><label for="network-host">Tablet IP / Scheiber host</label><input id="network-host" type="text" value="'+h(state.networkHost)+'" autocapitalize="off" spellcheck="false"></div>':'')+
      (state.connectionMode==='custom'?'<div class="field"><label for="custom-url">WebSocket URL (ws:// or wss://)</label><input id="custom-url" type="text" value="'+h(state.customUrl)+'" spellcheck="false"></div>':'')+
      '<div class="field"><label>Target address</label><div class="line-quiet">'+h(connectionUrl())+'</div></div>'+
      '<div class="field"><label><input type="checkbox" id="auto-connect"'+(state.autoConnect?' checked':'')+'>Connect automatically at startup</label></div>'+
      '<div class="buttons-row"><button class="action-button" data-action="connect">Connect (live mode)</button><button class="action-button secondary" data-action="demo">Demo mode</button><button class="action-button secondary" data-action="disconnect">Disconnect</button></div>'+
      '<p class="line-quiet">Status: '+statusLabel()+'. Last event: '+(state.data.lastAt?new Date(state.data.lastAt).toLocaleTimeString('en-GB'):'--')+'. Messages: '+state.data.messages+'.</p>'+
      '<div class="notice info">The client receives live data and sends ALIVE keepalives. If manually unlocked, it may send individual Dc ON/OFF commands for lights, pump, and AUX. It does not write EMB configuration.</div></div>'+
      '<div class="card"><h2>Display / idle behavior</h2><div class="field"><label for="display-mode">Idle behavior</label><select id="display-mode">'+
      '<option value="system"'+(state.displayMode==='system'?' selected':'')+'>Use Android system screen timeout</option>'+
      '<option value="dim"'+(state.displayMode==='dim'?' selected':'')+'>Dim the interface</option>'+
      '<option value="always"'+(state.displayMode==='always'?' selected':'')+'>Do not dim in this app</option></select></div>'+
      '<div class="field"><label for="dim-seconds">Dim after how many seconds?</label><select id="dim-seconds">'+
      option(30,state.dimSeconds)+' '+option(60,state.dimSeconds)+' '+option(120,state.dimSeconds)+' '+option(300,state.dimSeconds)+' '+option(600,state.dimSeconds)+'</select></div>'+
      '<div class="buttons-row"><button class="action-button" data-action="save-display">Save display settings</button><button class="action-button secondary" data-action="test-dim">Test dimming</button></div>'+
      '<p class="line-quiet">Settings are stored locally in the browser. Dimming affects this interface only; controlling the physical display backlight or Android screen timeout requires APK integration.</p>'+
      '<div class="notice">No root or firmware modifications are required; the original Xperience installation remains untouched.</div></div></div>';
  }
  function option(sec,selected) { return '<option value="'+sec+'"'+(sec===selected?' selected':'')+'>'+sec+' s</option>'; }
  function render() {
    var y=screen.scrollTop;
    renderHeader(); renderNav();
    if(state.page==='dashboard') screen.innerHTML=renderDashboard();
    else if(state.page==='controls') screen.innerHTML=renderControls();
    else if(state.page==='truma') screen.innerHTML=renderTruma();
    else if(state.page==='energy') screen.innerHTML=renderEnergy();
    else if(state.page==='settings') screen.innerHTML=renderSettings();
    screen.scrollTop=y;
  }
  var renderTimer=null;
  function queueRender() { if(renderTimer) return; renderTimer=setTimeout(function(){ renderTimer=null; render(); },250); }
  function toast(s) { toastEl.textContent=s; toastEl.className='toast visible'; if(state.toastTimer) clearTimeout(state.toastTimer); state.toastTimer=setTimeout(function(){toastEl.className='toast';},2800); }
  function go(page) { state.page=page; screen.scrollTop=0; render(); }
  function applyPayload(obj) {
    if(!obj||typeof obj!=='object') return;
    var cls=obj['class']||obj.obj_kind, name=obj.module_name||obj.dc_name||obj.tank_type||obj.information_name;
    if(cls==='Battery') state.data.battery=obj;
    else if(cls==='Tank') state.data.tanks[obj.tank_type||name]=obj;
    else if(cls==='Dc') {
      var dcname=obj.dc_name||name;
      state.data.dc[dcname]=obj;
      var p=state.pendingDc[dcname];
      if(p && obj.is_alived===true && obj.dc_state===p.expected){
        clearTimeout(p.timer);delete state.pendingDc[dcname];
        toast('Confirmed: '+CONTROL_NAMES[dcname]+' '+(p.expected==='ON'?'ON':'OFF'));
      }
    }
    else if(cls==='Information') state.data.information[obj.information_name||name]=obj;
    else if(cls==='Heating') state.data.heating=obj;
    else if(cls==='Alarm') state.data.alarm[name]=obj;
    // Intentionally ignore ConfigV8, Bloc, and service/configuration objects.
    state.data.lastAt=Date.now(); state.data.messages++;
    queueRender();
  }
  function clearPendingDc() {
    for(var key in state.pendingDc) if(state.pendingDc.hasOwnProperty(key)){
      clearTimeout(state.pendingDc[key].timer);
    }
    state.pendingDc={};
  }
  function toggleControl(key) {
    if(!CONTROL_NAMES.hasOwnProperty(key)) return;
    if(state.mode==='demo') {toggleDemo(key);return;}
    if(!state.controlArmed || !isControlReady(key)){
      toast('No confirmed device state, connection, or control authorization');return;
    }
    var oldState=state.data.dc[key].dc_state;
    var next=oldState==='ON'?'OFF':'ON';
    // Protocol recovered from the OEM ccDc.changeState(name,state).
    // No config, heat, bulk or enable/disable operations.
    var msg={cmd:'alter_object',params:{filter:{'class':'Dc',dc_name:key},action:{dc_state:next}}};
    state.callbackCounter=state.callbackCounter%100+1;
    msg.callback_id=state.callbackCounter;
    var pending={expected:next,original:oldState,callback_id:msg.callback_id,timer:null};
    state.pendingDc[key]=pending;
    try {state.socket.send(JSON.stringify(msg));}
    catch(e) {delete state.pendingDc[key];state.controlArmed=false;toast('Failed to send command');render();return;}
    pending.timer=setTimeout(function(){
      if(state.pendingDc[key]===pending){
        delete state.pendingDc[key];
        toast('No confirmation: '+CONTROL_NAMES[key]+'. Check the physical device.');
        render();
      }
    },8000);
    render();
  }
  function handleControlReply(obj) {
    if(!obj || obj.callback_id===undefined) return false;
    for(var key in state.pendingDc) if(state.pendingDc.hasOwnProperty(key)){
      var p=state.pendingDc[key];
      if(p.callback_id===obj.callback_id){
        // An RPC acknowledgement does NOT confirm that the physical circuit changed.
        var result=obj.result;
        if(result===false || result==='ERROR' || result==='error' ||
            (result && (result.error || result.success===false))){
          clearTimeout(p.timer);delete state.pendingDc[key];
          toast('Scheiber rejected command: '+CONTROL_NAMES[key]);render();
        }
        return true;
      }
    }
    return true;
  }
  function clearNetworkTimers() { if(state.wsTimer){clearInterval(state.wsTimer);state.wsTimer=null;} if(state.reconnectTimer){clearTimeout(state.reconnectTimer);state.reconnectTimer=null;} }
  function disconnect(toDemo) {
    state.manualDisconnect=true; clearNetworkTimers(); clearPendingDc(); state.controlArmed=false;
    if(state.socket) {var s=state.socket;state.socket=null;try{s.close();}catch(e){}}
    state.connection='offline';
    if(toDemo) state.mode='demo';
    render();
  }
  function reconnect() {
    if(state.manualDisconnect || state.mode!=='live') return;
    if(state.reconnectTimer) clearTimeout(state.reconnectTimer);
    var delay=Math.min(30000,2000*Math.pow(2,Math.min(4,state.retryCount++)));
    state.reconnectTimer=setTimeout(function(){ state.reconnectTimer=null; openSocket(); },delay);
  }
  function openSocket() {
    clearNetworkTimers();
    if(state.socket) {try{state.socket.close();}catch(e){}}
    state.controlArmed=false; clearPendingDc(); state.connection='connecting'; state.url=connectionUrl(); render();
    var ws;
    try {ws=new WebSocket(state.url);} catch(e) {state.connection='offline';toast('Unable to open WebSocket: '+e.message);reconnect();render();return;}
    state.socket=ws;
    ws.onopen=function(){
      if(state.socket!==ws) return;
      state.connection='online'; state.retryCount=0;render();
      state.wsTimer=setInterval(function(){ if(ws.readyState===1){try{ws.send('ALIVE');}catch(e){}} },5000);
    };
    ws.onmessage=function(evt){
      if(state.socket!==ws) return;
      if(typeof evt.data!=='string') return;
      if(evt.data==='ALIVE'){state.data.lastAt=Date.now();return;}
      var obj;try{obj=JSON.parse(evt.data);}catch(e){return;}
      if(Object.prototype.toString.call(obj)==='[object Array]') {
        for(var i=0;i<obj.length;i++) {if(!handleControlReply(obj[i])) applyPayload(obj[i]);}
      } else if(!handleControlReply(obj)) applyPayload(obj);
    };
    ws.onerror=function(){ if(state.socket===ws){state.connection='offline';state.controlArmed=false;clearPendingDc();queueRender();} };
    ws.onclose=function(){
      if(state.socket!==ws) return;
      state.socket=null;state.connection='offline';state.controlArmed=false;clearPendingDc();
      if(state.wsTimer){clearInterval(state.wsTimer);state.wsTimer=null;}
      queueRender();reconnect();
    };
  }
  function connect() {
    if(state.page==='settings') {
      var host=document.getElementById('network-host'), custom=document.getElementById('custom-url'), aut=document.getElementById('auto-connect');
      if(host) state.networkHost=host.value.replace(/^\s+|\s+$/g,'');
      if(custom) state.customUrl=custom.value.replace(/^\s+|\s+$/g,'');
      if(aut) state.autoConnect=!!aut.checked;
      savePref('networkHost',state.networkHost);savePref('customUrl',state.customUrl);savePref('autoConnect',state.autoConnect);
    }
    var u=connectionUrl();
    if(!/^wss?:\/\//i.test(u)) {toast('Address must begin with ws:// or wss://');return;}
    if(state.mode==='live') disconnect(false);
    state.mode='live';state.manualDisconnect=false;state.retryCount=0;state.data=cloneData();
    openSocket();
  }
  function toggleDemo(key) {
    if(state.mode!=='demo') return;
    var item=state.demo.dc[key];if(!item)return;
    item.dc_state=item.dc_state==='ON'?'OFF':'ON';render();
  }
  function updateTruma(action) {
    if(state.mode!=='demo'||!state.demo.heating)return;
    var t=state.demo.heating;
    if(action==='setpoint-minus')t.heater_set_point=Math.max(5,t.heater_set_point-.5);
    if(action==='setpoint-plus')t.heater_set_point=Math.min(30,t.heater_set_point+.5);
    render();
  }
  function trumaChoice(v) {
    if(state.mode!=='demo'||!state.demo.heating)return;
    var t=state.demo.heating;
    if(v==='gas'){t.heater_gaz_mode=true;t.heater_electric_power=0;}
    else if(v==='900'){t.heater_gaz_mode=false;t.heater_electric_power=900;}
    else if(v==='1800'){t.heater_gaz_mode=false;t.heater_electric_power=1800;}
    else if(v==='auto'){t.heater_gaz_mode=true;t.heater_electric_power=900;}
    else if(v==='water-off')t.heater_hot_water_boost=0;
    else if(v==='water-normal')t.heater_hot_water_boost=1;
    else if(v==='water-boost')t.heater_hot_water_boost=2;
    else if(v==='fan-eco')t.heater_fan_speed='ECO';
    else if(v==='fan-normal')t.heater_fan_speed='NORMAL';
    else if(v==='fan-boost')t.heater_fan_speed='BOOST';
    render();
  }
  function findDataAttr(target,attr) {while(target&&target!==document){if(target.getAttribute&&target.getAttribute(attr)!==null)return target;target=target.parentNode;}return null;}
  function onClick(evt) {
    var n=findDataAttr(evt.target,'data-nav'); if(n){go(n.getAttribute('data-nav'));return;}
    n=findDataAttr(evt.target,'data-action'); if(!n)return;
    var a=n.getAttribute('data-action'),v=n.getAttribute('data-value');
    if(a==='toggle-control'){toggleControl(n.getAttribute('data-key'));return;}
    if(a==='arm-controls'){
      if(state.mode!=='live'||state.connection!=='online')return;
      if(state.controlArmed){state.controlArmed=false;toast('Controls locked');}
      else if(window.confirm('Enable physical camper controls?\n\nThe buttons can turn the pump, lighting, or AUX on or off.')){
        state.controlArmed=true;toast('Controls enabled for this session');
      }
      render();return;
    }
    if(a==='truma-tab'){state.trumaTab=v;render();return;}
    if(a==='setpoint-minus'||a==='setpoint-plus'){updateTruma(a);return;}
    if(a==='truma-choice'){trumaChoice(v);return;}
    if(a==='conn-mode') {state.connectionMode=v;savePref('connectionMode',v);render();return;}
    if(a==='connect') {connect();return;}
    if(a==='disconnect'){disconnect(false);toast('Disconnected. Live readings are unavailable.');return;}
    if(a==='demo'){disconnect(true);toast('Demo mode. No physical devices are controlled.');return;}
    if(a==='test-dim'){state.dimmed=true;dimOverlay.className='dim-overlay active';return;}
    if(a==='save-display'){
      var dm=document.getElementById('display-mode'),ds=document.getElementById('dim-seconds');
      if(dm) state.displayMode=dm.value;
      if(ds) state.dimSeconds=parseInt(ds.value,10)||120;
      savePref('displayMode',state.displayMode);savePref('dimSeconds',state.dimSeconds);
      toast('Display settings saved');render();return;
    }
  }
  // Master slide gesture: local demo state only; no outgoing WebSocket command.
  function sliderStart(x) {if(state.mode!=='demo'||state.page!=='controls')return;state.sliderStart=x;state.sliderX=0;}
  function sliderMove(x) {if(state.sliderStart===null)return;var s=document.getElementById('master-slider');if(!s)return;var width=s.clientWidth-85;state.sliderX=Math.max(0,Math.min(width,x-state.sliderStart));var knob=document.getElementById('slide-knob');if(knob)knob.style.left=(7+state.sliderX)+'px';}
  function sliderFinish() {
    if(state.sliderStart===null)return;
    var s=document.getElementById('master-slider');var width=s?s.clientWidth-85:200;
    var done=state.sliderX>width*.72;state.sliderStart=null;state.sliderX=0;
    if(done){
      state.demo.dc.Eclairage.dc_state='OFF';state.demo.dc.PompeAEau.dc_state='OFF';state.demo.dc.Auxiliaire.dc_state='OFF';
      toast('Master OFF simulated - no command was sent');
    }
    render();
  }
  document.addEventListener('click',onClick,false);
  document.addEventListener('touchstart',function(evt){var n=evt.target;while(n&&n!==document){if(n.id==='master-slider'&&evt.touches.length){sliderStart(evt.touches[0].clientX);break;}n=n.parentNode;}},false);
  document.addEventListener('touchmove',function(evt){if(state.sliderStart!==null&&evt.touches.length){sliderMove(evt.touches[0].clientX);evt.preventDefault();}},false);
  document.addEventListener('touchend',function(){sliderFinish();},false);
  document.addEventListener('mousedown',function(evt){var n=evt.target;while(n&&n!==document){if(n.id==='master-slider'){sliderStart(evt.clientX);break;}n=n.parentNode;}},false);
  document.addEventListener('mousemove',function(evt){if(state.sliderStart!==null)sliderMove(evt.clientX);},false);
  document.addEventListener('mouseup',sliderFinish,false);
  function wake() {state.lastActivity=Date.now();}
  document.addEventListener('touchstart',wake,false);document.addEventListener('mousedown',wake,false);document.addEventListener('keydown',wake,false);
  dimOverlay.addEventListener('click',function(evt){evt.stopPropagation();state.dimmed=false;dimOverlay.className='dim-overlay';wake();});
  dimOverlay.addEventListener('touchstart',function(evt){evt.stopPropagation();state.dimmed=false;dimOverlay.className='dim-overlay';wake();},false);
  setInterval(function(){
    var now=new Date();document.getElementById('current-time').textContent=('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2);
    if(state.displayMode==='dim'&&!state.dimmed&&Date.now()-state.lastActivity>state.dimSeconds*1000){state.dimmed=true;dimOverlay.className='dim-overlay active';}
    if(state.mode==='live'&&state.connection==='online'&&state.data.lastAt&&Date.now()-state.data.lastAt>30000){
      // Inactivity means stale data even if the socket is still open.
      state.connection='offline';queueRender();
      if(state.socket){try{state.socket.close();}catch(e){}}
    }
  },1000);
  render();
  if(state.autoConnect) connect();
}());

</script>
</body>
